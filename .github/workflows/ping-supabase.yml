name: Mantener Supabase Activo

on:
  schedule:
    - cron: "0 0 */4 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar Ping a Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -I
